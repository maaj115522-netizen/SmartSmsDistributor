name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and Extract Zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d project_source
          else
            echo "No zip file found."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ -d "project_source" ]; then
            cd project_source
          fi
          PROJECT_DIR=$(dirname "$(find . -maxdepth 3 -name 'settings.gradle*' | head -n 1)")
          if [[ -z "$PROJECT_DIR" || "$PROJECT_DIR" == "." ]]; then
            echo "Using current directory"
          else
            echo "Entering $PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartSmsDistributor-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          
